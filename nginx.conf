server {
	listen 80 default_server;
	server_name ${APP_DOMAIN};

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl default_server;
	server_name ${APP_DOMAIN};

	ssl_certificate /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	client_max_body_size 50M;
	proxy_connect_timeout 5s;
	proxy_read_timeout 60s;
	proxy_send_timeout 60s;

	# Las métricas son para el agente de observabilidad, que raspa directamente
	# el puerto 8080 del contenedor y no pasa por aquí. Servirlas a internet
	# publica el inventario de rutas de la API, sus códigos de respuesta y el
	# volumen de tráfico, sin dar nada a cambio. El comentario de server.go dice
	# que el acceso se controla en la capa de red: esta es esa capa.
	location = /api/v1/metrics {
		deny all;
	}

	location / {
		proxy_pass http://api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}
}
