# ==============================================================================
# Plataforma MOOC - Docker Compose para Producción en la Nube (Issue C4)
# ==============================================================================
# Define la ejecución de los componentes de la aplicación en la nube:
# - MinIO y minio-policy han sido retirados: la persistencia binaria se delega
#   completamente en el almacenamiento administrado de Google Cloud Storage (C3).
# - Mailpit ha sido retirado: el correo se envía a través de un servicio SMTP real.
# - Las credenciales y configuraciones sensibles se inyectan en ejecución desde
#   Secret Manager o variables de entorno, sin valores en duro en el repositorio.
# - La autenticación con Cloud Storage se realiza mediante las identidades adjuntas
#   a las máquinas virtuales (ADC) con permisos disjuntos por componente:
#     * sa-web-server (API): firma URLs V4 y lectura de objetos.
#     * sa-worker-server (Worker): escribe exclusivamente derivados HLS en hls/.
# ==============================================================================

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?Set APP_DOMAIN to the public DNS hostname}
    volumes:
      - ${NGINX_CONFIG_FILE:-./nginx.conf}:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  api:
    image: ${GCP_REGION:-us-east1}-docker.pkg.dev/${GCP_PROJECT_ID:-plataforma-mooc-entrega2}/${GCP_ARTIFACT_REGISTRY_REPOSITORY:-mooc}/api:${IMAGE_TAG:?Set IMAGE_TAG to the full commit SHA}
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - TRUSTED_PROXY_IP=172.30.0.2
      - STORAGE_BACKEND=gcs
      - S3_BUCKET=${S3_BUCKET:-plataforma-mooc-entrega2-media}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-plataforma-mooc-entrega2}
      - GCS_SIGNER_ACCOUNT=${GCS_SIGNER_ACCOUNT:-sa-web-server@plataforma-mooc-entrega2.iam.gserviceaccount.com}
      - MEDIA_UPLOAD_URL_TTL=${MEDIA_UPLOAD_URL_TTL:-24h}
      - MEDIA_DOWNLOAD_URL_TTL=${MEDIA_DOWNLOAD_URL_TTL:-1h}
      - MEDIA_MAX_UPLOAD_MB=${MEDIA_MAX_UPLOAD_MB:-1024}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-25}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-5m}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SESSION_TTL=${SESSION_TTL:-24h}
      - APP_BASE_URL=${APP_BASE_URL:?Set APP_BASE_URL to the HTTPS public origin}
      - EMAIL_VERIFICATION_TTL=${EMAIL_VERIFICATION_TTL:-24h}
      - PASSWORD_RESET_TTL=${PASSWORD_RESET_TTL:-1h}
      - CSRF_ALLOWED_ORIGINS=${CSRF_ALLOWED_ORIGINS:?Set CSRF_ALLOWED_ORIGINS to the HTTPS public origin}
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-24h}
      - RATE_LIMIT_LOGIN_ATTEMPTS=${RATE_LIMIT_LOGIN_ATTEMPTS:-10}
      - RATE_LIMIT_LOGIN_WINDOW=${RATE_LIMIT_LOGIN_WINDOW:-1m}
      - RATE_LIMIT_REGISTER_ATTEMPTS=${RATE_LIMIT_REGISTER_ATTEMPTS:-50}
      - RATE_LIMIT_REGISTER_WINDOW=${RATE_LIMIT_REGISTER_WINDOW:-1h}
      - RATE_LIMIT_RECOVERY_ATTEMPTS=${RATE_LIMIT_RECOVERY_ATTEMPTS:-50}
      - RATE_LIMIT_RECOVERY_WINDOW=${RATE_LIMIT_RECOVERY_WINDOW:-1h}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.0.3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend:
        ipv4_address: 172.30.0.4
    restart: unless-stopped

  worker:
    image: ${GCP_REGION:-us-east1}-docker.pkg.dev/${GCP_PROJECT_ID:-plataforma-mooc-entrega2}/${GCP_ARTIFACT_REGISTRY_REPOSITORY:-mooc}/worker:${IMAGE_TAG:?Set IMAGE_TAG to the full commit SHA}
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - STORAGE_BACKEND=gcs
      - S3_BUCKET=${S3_BUCKET:-plataforma-mooc-entrega2-media}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-plataforma-mooc-entrega2}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      # Los derivados van a un bucket propio, de lectura publica (#167). Vacio
      # deja el comportamiento de un solo bucket, que es el de MinIO en local.
      - MEDIA_HLS_BUCKET=${MEDIA_HLS_BUCKET:-}
      - MEDIA_WORK_DIR=${MEDIA_WORK_DIR:-/tmp/mooc-media}
      - MEDIA_MAX_ORIGINAL_MB=${MEDIA_MAX_ORIGINAL_MB:-2048}
      - MEDIA_HLS_LADDER=${MEDIA_HLS_LADDER:-}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-25}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-5m}
      - METRICS_PORT=9090
    volumes:
      # Volumen con nombre, no un bind mount del host.
      #
      # La imagen corre como el usuario `app` y prepara /tmp/mooc-media a su
      # nombre (Dockerfile.worker). Un bind mount de /tmp/mooc-worker lo crea
      # Docker en el host como root, y el contenedor no puede escribir dentro:
      # cada tarea moria con `mkdir ...: permission denied` y se reintentaba
      # hasta la DLQ. Lo encontro G3.
      #
      # Un volumen con nombre montado sobre la ruta que la imagen ya declara
      # hereda su propiedad al inicializarse, asi que el worker escribe sin
      # privilegios extra y el espacio sigue en el disco de la VM, medible con
      # `docker system df -v`. Ver la nota 21 de docs/entrega2/NOTAS_TECNICAS.md.
      - worker_scratch:/tmp/mooc-media
    ports:
      - "${WORKER_METRICS_PORT:-9090}:9090"

    depends_on:
      redis:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.0.5
    profiles:
      - worker
    restart: unless-stopped

volumes:
  worker_scratch:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
