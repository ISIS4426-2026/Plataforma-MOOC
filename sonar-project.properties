# =============================================================================
# Configuracion de SonarQube Cloud — Plataforma MOOC (Entrega 3, Issue H1 #228)
# =============================================================================
#
# Alcance: 100 % del codigo de aplicacion (API, workers y frontend).
# Ninguna linea de codigo productivo de API, workers o frontend se excluye.
# Las credenciales (SONAR_TOKEN) residen exclusivamente en GitHub Secrets.

sonar.organization=isis4426-2026
sonar.projectKey=ISIS4426-2026_Plataforma-MOOC
sonar.projectName=Plataforma-MOOC
sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# 1. Alcance de codigo productivo (API + Workers + Frontend)
# -----------------------------------------------------------------------------
# - api:          Contrato OpenAPI embebido (api/embed.go)
# - cmd:          Puntos de entrada de binarios productivos (cmd/api, cmd/worker,
#                 cmd/queue-exporter, cmd/seed-media)
# - internal:     Dominio, servicios, HTTP/handlers/middleware, repositorios
#                 PostgreSQL, cache Redis, almacenamiento GCS/MinIO, worker
#                 asynq y transcodificacion ffmpeg/HLS
# - frontend/src: Aplicacion React 19 + TypeScript (estudiante, profesor,
#                 cliente HTTP, autenticacion y componentes)
sonar.sources=api,cmd,internal,frontend/src

# -----------------------------------------------------------------------------
# 2. Alcance de pruebas automatizadas
# -----------------------------------------------------------------------------
sonar.tests=internal,migrations,frontend/src
sonar.test.inclusions=**/*_test.go,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# -----------------------------------------------------------------------------
# 3. Exclusiones justificadas una por una
# -----------------------------------------------------------------------------
# - **/*_test.go, frontend/src/**/*.test.ts, frontend/src/**/*.test.tsx:
#     En Go y en el frontend los archivos de prueba conviven en los mismos
#     directorios que el codigo productivo (internal/ y frontend/src/). Se
#     excluyen de sonar.sources para evitar doble indexacion con sonar.tests,
#     donde ya estan incluidos mediante sonar.test.inclusions.
# - frontend/node_modules/**, frontend/dist/**, frontend/coverage/**, bin/**:
#     Dependencias de terceros, artefactos compilados/empaquetados y reportes
#     generados durante la construccion.
# - docs/**, capacity-planning/**, scratch/**:
#     Documentacion Markdown/PDF, evidencias e informes de capacidad y medios
#     sinteticos temporales.
# - scripts/**:
#     Guiones operativos de campanas de carga, observacion en GCP y utilidades
#     puntuales de verificacion (fuera de los binarios y del bundle desplegado).
# - infra/**:
#     Infraestructura como codigo en Terraform y scripts de provision de VM,
#     validados en el job dedicado "Terraform Format & Validate" de ci.yml.
sonar.exclusions=**/*_test.go,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,bin/**,docs/**,capacity-planning/**,scratch/**,scripts/**,infra/**

# -----------------------------------------------------------------------------
# 4. Reportes de cobertura de pruebas unitarias
# -----------------------------------------------------------------------------
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

