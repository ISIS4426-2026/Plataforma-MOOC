# Perfil de servicio de las instancias de un grupo administrado (C1, #204).
#
# POR QUE HACE FALTA UN TERCER PERFIL
#
# `nginx.conf` sirve la VM fija de la Entrega 2: redirige el 80 a HTTPS y termina
# TLS en el 443 con un certificado de Let's Encrypt. Nada de eso funciona en una
# instancia de grupo, y por dos razones independientes:
#
#   1. **El certificado no existe.** Los certificados viven en /etc/letsencrypt
#      del anfitrion y no hay contenedor de certbot: se obtuvieron a mano. En una
#      instancia recien creada ese directorio esta vacio, asi que nginx con
#      `nginx.conf` **no arranca** --`ssl_certificate` apunta a un fichero que no
#      esta--.
#
#   2. **Certbot no podria obtenerlo.** Una instancia de grupo no tiene IP
#      publica (B2), asi que el desafio HTTP-01 no tiene por donde llegar. No es
#      una limitacion que se pueda sortear con mas configuracion.
#
# Y aunque el 443 funcionara, el 80 devolviendo 301 romperia el autohealing: la
# comprobacion de salud de C1 solo acepta 200, un 301 marca la instancia como no
# sana, y el autohealer la recrea. En bucle, porque la siguiente hace lo mismo.
#
# EL MODELO
#
# TLS se termina en el balanceador (C3) con un certificado administrado por
# Google, y los backends sirven HTTP plano en el 80 dentro de la VPC. Como las
# instancias no tienen IP publica, ese HTTP no viaja por internet en ningun
# tramo: el unico que habla con el 80 es el balanceador, mas los rangos de
# comprobacion de salud, y el cortafuegos de B2 no deja entrar a nadie mas.
#
# Lo que este perfil conserva de `nginx.conf`, porque no es decorativo:
#
#   * la denegacion de /api/v1/metrics, que de otro modo publicaria el
#     inventario de rutas de la API;
#   * las cabeceras de proxy, porque la API identifica al cliente por ellas y
#     confia en 172.30.0.2, que es la IP fija de este contenedor en el Compose.

# El balanceador pone X-Forwarded-Proto: https. Si por cualquier via llegara una
# peticion sin esa cabecera --una comprobacion de salud, una prueba desde dentro
# de la VPC-- se usa el esquema real en vez de dejarla vacia, que es lo que
# vuelve inseguras las cookies y rompe la generacion de enlaces.
map $http_x_forwarded_proto $mooc_fwd_proto {
	default $http_x_forwarded_proto;
	''      $scheme;
}

server {
	listen 80 default_server;

	# Sin `server_name ${APP_DOMAIN}`: el balanceador ya decidio a que backend
	# manda la peticion, y atar el servidor al nombre haria que una comprobacion
	# de salud --que llega por IP-- cayera en otro bloque.
	server_name _;

	client_max_body_size 50M;
	proxy_connect_timeout 5s;
	proxy_read_timeout 60s;
	proxy_send_timeout 60s;

	# Igual que en nginx.conf: las metricas son para el agente de observabilidad,
	# que raspa el 8080 del contenedor y no pasa por aqui. Servirlas publicaria
	# el inventario de rutas, los codigos de respuesta y el volumen de trafico.
	location = /api/v1/metrics {
		deny all;
	}

	location / {
		proxy_pass http://api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mooc_fwd_proto;
		proxy_set_header X-Forwarded-Host $host;
	}
}
