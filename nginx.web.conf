# nginx del frontend (issue #211, D1). Plantilla: la imagen sustituye ${API_UPSTREAM} y
# ${STORAGE_ORIGINS} al arrancar (ver Dockerfile.web). Escucha en HTTP: el HTTPS lo termina
# el balanceador (o el nginx de la VM en el despliegue de la Entrega 2).
# El balanceador (C3) termina TLS y pone X-Forwarded-Proto: https. Sin esa cabecera (una comprobacion
# de salud, una prueba dentro de la VPC, el Compose local) se usa el esquema real, en vez de dejarla
# vacia: vacia vuelve inseguras las cookies y rompe los enlaces. Es el mismo criterio de nginx.mig.conf.
map $http_x_forwarded_proto $mooc_fwd_proto {
	default $http_x_forwarded_proto;
	''      $scheme;
}

server {
	listen 80 default_server;
	server_name _;
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	client_max_body_size 50M;
	proxy_connect_timeout 5s;
	proxy_read_timeout 60s;
	proxy_send_timeout 60s;

	# Cabeceras de seguridad. La politica de contenido solo deja cargar scripts y estilos propios
	# (nada de scripts en linea); los archivos del curso se piden al almacenamiento de objetos:
	# subidas por URL firmada (connect-src), video HLS (media-src y blob: del reproductor).
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: ${STORAGE_ORIGINS}; media-src 'self' blob: ${STORAGE_ORIGINS}; connect-src 'self' ${STORAGE_ORIGINS}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	# Las metricas son para el agente de observabilidad y no se sirven al publico (igual que en nginx.conf).
	location = /api/v1/metrics {
		deny all;
	}

	# La API, en el mismo origen. Las cabeceras de reenvio son las de nginx.mig.conf: la API decide el
	# origen y el esquema a partir de ellas. Detras del balanceador, X-Forwarded-For lleva la cadena
	# (cliente, balanceador) y la API confia en este contenedor como proxy (TRUSTED_PROXY_IP).
	location /api/ {
		proxy_pass http://${API_UPSTREAM};
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mooc_fwd_proto;
		proxy_set_header X-Forwarded-Host $host;
	}

	# Archivos con huella en el nombre: no cambian nunca, se cachean un ano.
	location /assets/ {
		expires 1y;
		try_files $uri =404;
	}

	# La pagina y la version no se cachean: cada despliegue debe verse al recargar.
	location = /index.html {
		expires -1;
	}
	location = /version.json {
		expires -1;
	}

	# Rutas de la aplicacion (/login, /cursos/...): las resuelve el router del navegador.
	location / {
		try_files $uri /index.html;
	}
}
