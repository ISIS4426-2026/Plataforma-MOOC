# nginx del frontend (issue #211, D1). Plantilla: la imagen sustituye ${API_UPSTREAM} y
# ${STORAGE_ORIGINS} al arrancar (ver Dockerfile.web). Escucha en HTTP: el HTTPS lo termina
# el balanceador (o el nginx de la VM en el despliegue de la Entrega 2).
server {
	listen 80 default_server;
	server_name _;
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	client_max_body_size 50M;
	proxy_connect_timeout 5s;
	proxy_read_timeout 60s;
	proxy_send_timeout 60s;

	# Cabeceras de seguridad. La politica de contenido solo deja cargar scripts y estilos propios
	# (nada de scripts en linea); los archivos del curso se piden al almacenamiento de objetos:
	# subidas por URL firmada (connect-src), video HLS (media-src y blob: del reproductor).
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: ${STORAGE_ORIGINS}; media-src 'self' blob: ${STORAGE_ORIGINS}; connect-src 'self' ${STORAGE_ORIGINS}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	# Las metricas son para el agente de observabilidad y no se sirven al publico (igual que en nginx.conf).
	location = /api/v1/metrics {
		deny all;
	}

	# La API, en el mismo origen. Las cabeceras de reenvio son las de nginx.conf: la API decide el
	# origen y el esquema a partir de ellas, y X-Forwarded-For lleva la IP real del par (no se
	# acepta la que mande el cliente).
	location /api/ {
		proxy_pass http://${API_UPSTREAM};
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}

	# Archivos con huella en el nombre: no cambian nunca, se cachean un ano.
	location /assets/ {
		expires 1y;
		try_files $uri =404;
	}

	# Configuracion de entorno que el navegador lee al arrancar (frontend/src/runtime.ts). Va aqui y
	# no dentro del bundle para que el mismo build sirva en local y en la nube, y para que el
	# bundle no lleve direcciones de ningun entorno. Solo valores publicos.
	location = /config.json {
		default_type application/json;
		expires -1;
		return 200 '{"hlsBaseUrl":"${HLS_BASE_URL}"}';
	}

	# La pagina y la version no se cachean: cada despliegue debe verse al recargar.
	location = /index.html {
		expires -1;
	}
	location = /version.json {
		expires -1;
	}

	# Rutas de la aplicacion (/login, /cursos/...): las resuelve el router del navegador.
	location / {
		try_files $uri /index.html;
	}
}
