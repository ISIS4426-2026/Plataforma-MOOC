openapi: 3.1.0
info:
  title: Plataforma MOOC API
  description: >
    Official REST API specification for the Massive Open Online Course (MOOC) platform (ISIS4426 Cloud Course).
    All endpoints require HTTP/JSON communications and strictly reside under the `/api/v1` path prefix.
  version: 1.0.0
  contact:
    name: MOOC Engineering Team
    email: support@mooc-platform.example.com
    url: https://mooc-platform.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: Primary API v1 Endpoint Base Path

tags:
  - name: Health
    description: System operational health and dependency diagnostics endpoints.
  - name: Auth
    description: Public registration, authentication, and session control endpoints.
  - name: Users
    description: Administrative user account management and professor provisioning.
  - name: Audit
    description: Read side of the immutable audit trail of administrative and authoring actions.
  - name: Courses
    description: Course catalog, authoring hierarchy, draft management, and publication versioning.
  - name: Modules
    description: Structure and ordering of modules, units, and learning resources within courses.
  - name: Quizzes
    description: Multiple-choice quizzes and server-side automated scoring submissions.
  - name: Progress
    description: Heartbeat tracking, dwell time, and server-validated course progress.
  - name: Badges
    description: Digital completion badges emission, retrieval, and public privacy-preserving verification.
  - name: Media
    description: Direct presigned S3 upload URLs and async media processing orchestration.

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check operational health
      description: Returns the operational status of the API and its underlying datastores (PostgreSQL, Redis).
      operationId: getHealthStatus
      responses:
        '200':
          description: System is operational and healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new student account
      description: >
        Public self-registration. The account is created in `pending_verification`
        and a single-use activation link is mailed to the address.


        The role is never taken from the request: this endpoint only ever creates
        students. Unknown properties in the body are rejected with `400`, so a
        smuggled `role` field is refused rather than silently ignored.
      operationId: registerStudent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '201':
          description: Student account successfully registered and activation email sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
        '403':
          $ref: '#/components/responses/403CSRFOriginRejected'
        '422':
          $ref: '#/components/responses/422IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/verify:
    get:
      tags:
        - Auth
      summary: Activate an account with the emailed token
      description: >
        Consumes the single-use activation token and moves the account from
        `pending_verification` to `active`.


        Unknown, already consumed and expired tokens are indistinguishable: all
        three answer `400` with code `invalid_token`, so the endpoint cannot be
        used to probe which tokens exist.
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          description: Raw activation token delivered in the verification email.
          schema:
            type: string
      responses:
        '200':
          description: Account verified and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: The token is unknown, already used or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: invalid_token
                message: El enlace de verificación no es válido o ya fue utilizado.
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/verify/resend:
    post:
      tags:
        - Auth
      summary: Resend the activation link
      description: >
        Issues a fresh activation link and retires any previous one, so only the
        most recent message works.


        The response is always `202` with the same body, whether the address is
        unknown, still pending or already active. No email is sent in the first
        two cases. This keeps the endpoint from revealing which addresses are
        registered.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Request accepted. A link is sent only if the account exists and is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '403':
          $ref: '#/components/responses/403CSRFOriginRejected'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user session
      description: >
        Verifies credentials and opens a session, returning an opaque bearer
        token. The raw token is returned exactly once, here; only its SHA-256
        hash is persisted.


        The token is deliberately opaque rather than a self-contained JWT: the
        session is re-resolved on every request, which is what allows a
        revocation to take effect immediately.


        Account status is inspected only after the password verifies, and an
        unknown address costs the same work as a real one, so neither the
        response nor its timing reveals which addresses are registered.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          description: Invalid credentials. Identical for a wrong password and an unknown address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: invalid_credentials
                message: Credenciales inválidas.
        '403':
          description: The credentials are valid but the account cannot open a session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailNotVerified:
                  summary: Email not verified yet
                  value:
                    code: email_not_verified
                    message: Debes verificar tu correo antes de iniciar sesión.
                accountSuspended:
                  summary: Account suspended by an administrator
                  value:
                    code: account_suspended
                    message: La cuenta está suspendida.
                csrfOriginRejected:
                  summary: Origin not on the allowlist
                  value:
                    code: csrf_origin_rejected
                    message: El origen de la solicitud no está permitido.
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/password/forgot:
    post:
      tags:
        - Auth
      summary: Request a password recovery link
      description: >
        Mails a single-use recovery link, retiring any previous one so only the
        most recent message works.


        The response is always `202` with the same body: an unknown address, a
        registered one, and even a failure to deliver the message all answer
        identically, so the endpoint cannot be used to discover which addresses
        exist.
      operationId: requestPasswordReset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted. A link is sent only if the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '403':
          $ref: '#/components/responses/403CSRFOriginRejected'
        '422':
          $ref: '#/components/responses/422IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/password/reset:
    post:
      tags:
        - Auth
      summary: Set a new password with a recovery token
      description: >
        Consumes the single-use recovery token and replaces the password.


        Every active session of the account is revoked before this returns, in
        both the durable store and the cache, so any other device is logged out.


        The new password is validated before the token is consumed, so a
        rejected password does not burn the link and the user can retry with the
        same one. Unknown, already used and expired tokens are indistinguishable.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password replaced and every previous session revoked.
        '400':
          description: The password is unacceptable, or the token is unknown, already used or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  summary: Token no longer usable
                  value:
                    code: invalid_token
                    message: El enlace de recuperación no es válido o ya fue utilizado.
                invalidPassword:
                  summary: Password does not meet the minimum length
                  value:
                    code: invalid_input
                    message: Los datos enviados no son válidos.
        '403':
          $ref: '#/components/responses/403CSRFOriginRejected'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke current session
      description: >
        Revokes the session backing the presented token. The cached entry is
        dropped as well, so the very next request with that token is rejected.
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked successfully.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/sessions:
    get:
      tags:
        - Auth
      summary: List the caller's active sessions
      description: >
        Returns the sessions that can currently authenticate: neither revoked nor
        expired. Token hashes are never exposed.
      operationId: listOwnSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions of the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /auth/sessions/{session_id}:
    delete:
      tags:
        - Auth
      summary: Revoke one of the caller's sessions
      description: >
        Self-service revocation. After it returns, a request carrying that
        session's token is rejected immediately.


        A session belonging to another user answers `404`, not `403`, so the
        endpoint cannot be used to discover which session identifiers exist.
      operationId: revokeOwnSession
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          description: Identifier of the session to revoke.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session revoked successfully.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /admin/users:
    get:
      tags:
        - Users
      summary: List accounts
      description: >
        Administrative listing of accounts, newest first, with optional filters
        by role and status.


        Pagination is by cursor rather than by offset: an offset shifts whenever
        a row is inserted or removed, which makes a client silently skip or
        repeat users while it pages through them.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [administrador, profesor, estudiante]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_verification, active, suspended]
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /admin/users/{user_id}:
    get:
      tags:
        - Users
      summary: Read a single account
      description: >
        Returns the account together with its `ETag`, which is what a client
        needs before attempting a conditional write.


        A request carrying `If-None-Match` with the current tag answers `304`
        without a body, so polling for changes costs almost nothing.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The account.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '304':
          $ref: '#/components/responses/304NotModified'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /admin/users/{user_id}/role:
    patch:
      tags:
        - Users
      summary: Change the role of an account
      description: >
        Assigns a new role. Demoting the only remaining active administrator is
        refused with `409`: the caller has the permission, it is the state of
        the platform that forbids the change.


        The rule is enforced inside the same transaction as the change, under a
        row lock on the active administrators, so two concurrent requests cannot
        each remove one and leave the platform with none.


        The change and its audit entry are written together, so neither can
        exist without the other.
      operationId: changeUserRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409LastAdminProtected'
        '412':
          $ref: '#/components/responses/412PreconditionFailed'
        '422':
          $ref: '#/components/responses/422IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /admin/users/{user_id}/status:
    patch:
      tags:
        - Users
      summary: Suspend or reactivate an account
      description: >
        Suspending also revokes the account's sessions, in both the durable
        store and the cache, so access stops immediately rather than at the next
        expiry.


        Suspending the only remaining active administrator is refused with
        `409`, under the same rule and the same transaction as a role change.
      operationId: changeUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: Status updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409LastAdminProtected'
        '412':
          $ref: '#/components/responses/412PreconditionFailed'
        '422':
          $ref: '#/components/responses/422IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /admin/audit-logs:
    get:
      tags:
        - Audit
      summary: List the audit trail
      description: >
        Administrative listing of the append-only audit trail, newest first.
        Every administrative action (role change, suspension) and authoring
        action (create/edit/publish a course) that mutates state is recorded
        here in the same transaction as the change itself, so an entry can
        never exist without the change it describes, or vice versa.


        The trail is immutable at the database level: no operation, through
        this API or otherwise, can edit or delete an existing entry.
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only entries recorded for exactly this actor.
        - name: action_prefix
          in: query
          required: false
          schema:
            type: string
          description: >
            Only entries whose action starts with this prefix, e.g. "course."
            for every course-related action regardless of which one.
          example: "course."
        - name: target_resource
          in: query
          required: false
          schema:
            type: string
          description: Only entries recorded against exactly this `<type>:<id>` target.
          example: "course:110ec58a-a0f2-4ac4-8393-c866d813b8d1"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only entries recorded at or after this timestamp (RFC3339).
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only entries recorded at or before this timestamp (RFC3339).
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: One page of the audit trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /users/professors:
    post:
      tags:
        - Users
      summary: Create a professor account
      description: Admin-only endpoint to provision professor accounts (public registration for professors is prohibited).
      operationId: createProfessor
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfessorRequest'
      responses:
        '201':
          description: Professor account provisioned successfully.
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /courses:
    get:
      tags:
        - Courses
      summary: List published courses catalog
      description: Public course catalog search supporting cursor pagination and conditional GET via ETag.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Text search query to filter courses by title or description.
      responses:
        '200':
          description: List of published courses with pagination details.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '304':
          $ref: '#/components/responses/304NotModified'
        '400':
          $ref: '#/components/responses/400BadRequest'

    post:
      tags:
        - Courses
      summary: Create a new course draft
      description: Instructor or Admin endpoint to create a new course in draft status.
      operationId: createCourse
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course draft created successfully.
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /courses/{course_id}:
    get:
      tags:
        - Courses
      summary: Get detailed course information
      description: Retrieve details of a specific course by ID with support for conditional HTTP caching using ETag.
      operationId: getCourseById
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the course.
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Course details retrieved successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '304':
          $ref: '#/components/responses/304NotModified'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      tags:
        - Courses
      summary: Update course draft
      description: Modify an existing course draft. Requires If-Match for optimistic concurrency check to avoid lost updates.
      operationId: updateCourse
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the course.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Course draft updated successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '412':
          $ref: '#/components/responses/412PreconditionFailed'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /courses/{course_id}/publish:
    post:
      tags:
        - Courses
      summary: Publish course draft version
      description: >
        Validates the course before publishing: complete metadata, minimal
        structure (at least one module with a unit with a visible, available
        resource), and at least one mandatory resource on that path to
        define the approval criteria. Every problem found is returned in a
        single 422, not just the first (issue #20). Once published, the
        version is immutable -- see /courses/{course_id}/unpublish for the
        MVP's route back to editable.
      operationId: publishCourse
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the course draft to publish.
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Course version successfully published and made immutable.
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: The course is already published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The course does not meet the publication requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishValidationErrorResponse'

  /courses/{course_id}/unpublish:
    post:
      tags:
        - Courses
      summary: Unpublish a course
      description: >
        Takes a published course off the catalog and makes it editable
        again. The MVP's way to edit a published course (section 5.1): fork-
        a-new-draft-version is explicitly optional/Should scope (section
        5.2), so this is a plain status transition on the same row.
      operationId: unpublishCourse
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Course unpublished and editable again.
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: The course is not currently published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses/{course_id}/modules:
    get:
      tags:
        - Modules
      summary: List modules and resources of a course
      description: Retrieve ordered structural modules, units, and resource metadata for a course.
      operationId: getCourseModules
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the course.
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Modules of the course, ordered by position.
          content:
            application/json:
              schema:
