        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Opaque session token issued by `POST /auth/login`. It is not a JWT: the
        session is looked up on every request, which is what makes revocation
        take effect immediately.

  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor token returned by previous page request.
      example: "eyJpZCI6MTIzLCJjcmVhdGVkX2F0IjoxNjk4Nzc2MDAwfQ=="

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Maximum number of items to return per page (1-100, default 20).
      example: 20

    UserIdParam:
      name: user_id
      in: path
      required: true
      description: Identifier of the account the operation applies to.
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Unique UUID token to guarantee idempotent processing of state-changing operations.
      example: "a8b9c1d2-e3f4-4a5b-8c6d-7e8f9a0b1c2d"

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag header value for conditional HTTP request caching. Returns 304 Not Modified if matching.
      example: '"w/33a64df551425fcc55e4d42a148795d9f25f89d4"'

    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag header value for optimistic concurrency control. Returns 412 Precondition Failed if mismatching.
      example: '"w/33a64df551425fcc55e4d42a148795d9f25f89d4"'

  headers:
    ETag:
      description: Entity tag representing the current version digest of the requested resource.
      schema:
        type: string
      example: '"w/33a64df551425fcc55e4d42a148795d9f25f89d4"'

    IdempotencyKey:
      description: Echoed Idempotency-Key UUID header.
      schema:
        type: string
        format: uuid
      example: "a8b9c1d2-e3f4-4a5b-8c6d-7e8f9a0b1c2d"

  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          example: "pass"
        timestamp:
          type: string
          format: date-time
          example: "2026-09-05T16:30:00Z"
        services:
          type: object
          required:
            - database
            - redis
          properties:
            database:
              type: string
              example: "up"
            redis:
              type: string
              example: "up"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Standard machine-readable error code string identifier.
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable explanation of the error.
          example: "Email address is invalid or missing"
        details:
          type: object
          description: Structured key-value object containing detailed validation or field errors.
          additionalProperties: true
          example:
            field: "email"
            issue: "Must be a valid email format"

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "structure"
        message:
          type: string
          example: "El curso debe tener al menos un módulo con una unidad con un recurso visible y disponible."

    PublishValidationErrorResponse:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          example: "validation_failed"
        message:
          type: string
          example: "El curso no cumple los requisitos de publicación."
        details:
          type: array
          description: Every requirement the course fails, not just the first (issue #20).
          items:
            $ref: '#/components/schemas/FieldError'

    CursorPagination:
      type: object
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque pagination token for requesting the next page. Null if no remaining items.
          example: "eyJpZCI6MTI0LCJjcmVhdGVkX2F0IjoxNjk4Nzc2MTAwfQ=="
        has_more:
          type: boolean
          description: Boolean flag indicating if additional records exist past this page.
          example: true

    RegisterStudentRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"
        password:
          type: string
          minLength: 8
          example: "StrongPassword123!"
        full_name:
          type: string
          example: "Jane Doe"

    CreateProfessorRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: "prof.smith@example.com"
        password:
          type: string
          minLength: 8
          example: "ProfSecurePass2026!"
        full_name:
          type: string
          example: "Prof. Alan Smith"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "UserSecret123!"

    LoginResponse:
      type: object
      required:
        - token
        - expires_at
        - user
      properties:
        token:
          type: string
          description: >
            Opaque bearer session token, 256 bits of entropy encoded as
            URL-safe base64. Returned exactly once; only its SHA-256 hash is
            stored. Send it as `Authorization: Bearer <token>`.
          example: "6RyPl3wXaFNvtXfXd2elqTnMcVvA1sKmzR0oQpYbW3g"
        expires_at:
          type: string
          format: date-time
          description: Instant after which the session stops authenticating requests.
          example: "2026-09-10T02:04:06.829088565Z"
        user:
          $ref: '#/components/schemas/UserResponse'

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Si la cuenta existe y está pendiente de verificación, enviamos un nuevo enlace."

    RegisterResponse:
      type: object
      required:
        - user
        - message
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
          example: "Cuenta creada. Revisa tu correo para activarla."

    VerifyResponse:
      type: object
      required:
        - user
        - message
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
          example: "Cuenta verificada correctamente."

    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"

    ChangeRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [administrador, profesor, estudiante]
          example: "profesor"

    ChangeStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending_verification, active, suspended]
          example: "suspended"

    UserEnvelope:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'

    UserListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    AuditLogEntry:
      type: object
      required:
        - id
        - action
        - target_resource
        - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Who performed the action. Null when the platform acted on its own.
        action:
          type: string
          description: "Dotted `<resource>.<past-tense fact>` name, e.g. \"course.created\"."
          example: "course.created"
        target_resource:
          type: string
          description: "What the action was performed on, as `<type>:<id>`."
          example: "course:110ec58a-a0f2-4ac4-8393-c866d813b8d1"
        details:
          type: object
          additionalProperties: true
          description: Whatever else is worth knowing about the action, such as a field's previous and new value. Never credentials, tokens or password hashes.
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Raw recovery token delivered in the password reset email.
        password:
          type: string
          minLength: 8
          description: >
            New password. bcrypt truncates past 72 bytes, so longer values are
            rejected rather than silently cut short.
          example: "NuevaContrasenaSegura123"

    SessionResponse:
      type: object
      required:
        - id
        - expires_at
        - created_at
        - last_activity_at
      properties:
        id:
          type: string
          format: uuid
          example: "346c7322-fc0f-435a-8c37-b9a0f43a9be5"
        user_agent:
          type: string
          description: Client that opened the session, recorded for recognition in this listing.
          example: "Mozilla/5.0"
        ip_address:
          type: string
          description: >
            Peer address of the connection. Forwarding headers are ignored, since
            any client can set them.
          example: "172.18.0.1"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time

    SessionListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionResponse'

    UserResponse:
      type: object
      required:
        - id
        - email
        - full_name
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "user@example.com"
        full_name:
          type: string
          example: "Jane Doe"
        role:
          type: string
          enum: [administrador, profesor, estudiante]
          example: "estudiante"
        status:
          type: string
          enum: [pending_verification, active, suspended]
          example: "active"

    CreateCourseRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          example: "Introducción a Arquitectura Cloud"
        description:
          type: string
          example: "Curso completo de conceptos y patrones en la nube."

    UpdateCourseRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          example: "Introducción a Arquitectura Cloud (Actualizado)"
        description:
          type: string
          example: "Descripción actualizada del curso."

    CourseResponse:
      type: object
      required:
        - id
        - stable_id
        - title
        - version
        - status
      properties:
        id:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        stable_id:
          type: string
          format: uuid
          example: "110ec58a-a0f2-4ac4-8393-c866d813b8d1"
        title:
          type: string
          example: "Introducción a Arquitectura Cloud"
        description:
          type: string
          example: "Curso completo de conceptos y patrones en la nube."
        version:
          type: integer
          example: 1
        status:
          type: string
          enum: [draft, published, unpublished]
          example: "draft"

    CourseListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseResponse'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    CreateModuleRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: "Módulo 1: Fundamentos de Nube"

    ModuleResponse:
      type: object
      required:
        - id
        - stable_id
        - course_id
        - title
        - position
      properties:
        id:
          type: string
          format: uuid
          example: "8d9e6679-7425-40de-944b-e07fc1f90ae8"
        stable_id:
          type: string
          format: uuid
          example: "220ec58a-a0f2-4ac4-8393-c866d813b8d2"
        course_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Módulo 1: Fundamentos de Nube"
        position:
          type: integer
          description: Zero-based position among sibling modules, assigned by issue #16's ordering policy.
          example: 0

    CreateUnitRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: "Unidad 1: Conceptos básicos"

    UnitResponse:
      type: object
      required:
        - id
        - stable_id
        - module_id
        - title
        - position
      properties:
        id:
          type: string
          format: uuid
        stable_id:
          type: string
          format: uuid
        module_id:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer

    CreateResourceRequest:
      type: object
      required:
        - title
        - type
      properties:
        title:
          type: string
          example: "Video introductorio"
        type:
          type: string
          enum: [text, image, video, audio, pdf, presentation, downloadable, iframe, external_link, quiz]
        is_visible:
          type: boolean
          default: true
        is_mandatory:
          type: boolean
          default: true
        allow_download:
          type: boolean
          default: false
        content_text:
          type: string
          description: Canonical extended Markdown, for text resources.

    UpdateResourceRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        is_visible:
          type: boolean
        is_mandatory:
          type: boolean
        allow_download:
          type: boolean

    ResourceResponse:
      type: object
      required:
        - id
        - stable_id
        - unit_id
        - title
        - type
        - position
        - is_visible
        - is_mandatory
        - allow_download
      properties:
        id:
          type: string
          format: uuid
        stable_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
          enum: [text, image, video, audio, pdf, presentation, downloadable, iframe, external_link, quiz]
        position:
          type: integer
        is_visible:
          type: boolean
        is_mandatory:
          type: boolean
        allow_download:
          type: boolean
        content_text:
          type: string
        object_key:
          type: string
          description: Reference to the object in S3/MinIO. Never the binary itself.
        processing_status:
          type: string
          enum: [pending, processing, completed, failed]

    QuizSubmissionRequest:
      type: object
      required:
        - answers
      properties:
        answers:
          type: array
          items:
            type: object
            required:
              - question_id
              - selected_option_id
            properties:
              question_id:
                type: string
                format: uuid
              selected_option_id:
                type: string
                format: uuid

    QuizSubmissionResponse:
      type: object
      required:
        - submission_id
        - score
        - passed
      properties:
        submission_id:
          type: string
          format: uuid
        score:
          type: number
          format: float
          example: 85.5
        passed:
          type: boolean
          example: true

    ProgressHeartbeatRequest:
      type: object
      required:
        - course_id
        - resource_stable_id
        - dwell_time_seconds
      properties:
        course_id:
          type: string
          format: uuid
        resource_stable_id:
          type: string
          format: uuid
        dwell_time_seconds:
          type: integer
          example: 30

    ProgressResponse:
      type: object
      required:
        - course_id
        - percentage
        - completed_resource_stable_ids
      properties:
        course_id:
          type: string
          format: uuid
        percentage:
          type: number
          format: float
          example: 45.0
        completed_resource_stable_ids:
          type: array
          items:
            type: string
            format: uuid

    BadgeResponse:
      type: object
      required:
        - id
        - course_id
        - issued_at
        - verification_code
        - verification_url
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        issued_at:
          type: string
          format: date-time
        verification_code:
          type: string
          example: "a8f3d9b1c0e"
        verification_url:
          type: string
          example: "https://mooc-platform.example.com/badges/verify/a8f3d9b1c0e"

    BadgeVerificationResponse:
      type: object
      required:
        - valid
        - course_title
        - issued_at
      properties:
        valid:
          type: boolean
          example: true
        course_title:
          type: string
          example: "Introducción a Arquitectura Cloud"
        issued_at:
          type: string
          format: date-time
        revoked:
          type: boolean
          example: false

    PresignedUrlRequest:
      type: object
      required:
        - filename
        - mime_type
        - file_size_bytes
      properties:
        filename:
          type: string
          example: "intro_lecture.mp4"
        mime_type:
          type: string
          example: "video/mp4"
        file_size_bytes:
          type: integer
          example: 104857600

    PresignedUrlResponse:
      type: object
      required:
        - upload_url
        - object_key
        - expires_at
      properties:
        upload_url:
          type: string
          example: "https://storage.example.com/mooc-bucket/intro_lecture.mp4?X-Amz-Algorithm=..."
        object_key:
          type: string
          example: "uploads/2026/09/intro_lecture.mp4"
        expires_at:
          type: string
          format: date-time

  responses:
    304NotModified:
      description: Resource has not changed since the last request (If-None-Match match).
      headers:
        ETag:
          $ref: '#/components/headers/ETag'

    400BadRequest:
      description: Invalid request parameters or body payload syntax.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    401Unauthorized:
      description: Authentication required or invalid/expired session token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403Forbidden:
      description: Insufficient permissions or role privileges for requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404NotFound:
      description: The requested resource identifier was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409Conflict:
      description: Resource state conflict (e.g. duplicate email registration or published immutability constraint).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409LastAdminProtected:
      description: >
        The change would leave the platform without an active administrator.


        This is a conflict rather than a forbidden: the caller holds the
        permission, and it is the state of the platform that refuses the change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: last_admin_protected
            message: No es posible dejar la plataforma sin administradores activos.

    422IdempotencyKeyReused:
      description: >
        The `Idempotency-Key` was already used with a different payload.


        This is a client defect rather than a retry: returning the first response
        would hide the mistake and make the client believe a request it never
        successfully sent had been applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: idempotency_key_reused
            message: La Idempotency-Key ya se usó con un cuerpo diferente.

    412PreconditionFailed:
      description: Optimistic concurrency check failed (If-Match header value does not match current state).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    422UnprocessableEntity:
      description: Semantic validation error in request body payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    429TooManyRequests:
      description: >
        Rate limit exceeded. Quotas are counted per client address and per
        endpoint group, so exhausting one does not affect the others.


        Development defaults: 10 login attempts per minute, 20 registrations per
        hour, and 10 recovery or verification resends per hour. Production
        should tighten them, particularly on login.
      headers:
        Retry-After:
          description: Seconds to wait before the quota resets.
          schema:
            type: integer
        RateLimit-Limit:
          description: Ceiling that applied to this decision.
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the current window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: rate_limit_exceeded
            message: Demasiadas solicitudes. Intenta de nuevo más tarde.

    403CSRFOriginRejected:
      description: >
        The request declared an Origin or Referer that is not on the allowlist.


        This API authenticates with a bearer token, which browsers never attach
        automatically, so classic CSRF cannot reach it. The origin check is the
        defence that does apply, and it only rejects requests that declare an
        origin: a caller that sends none, such as curl or a server-to-server
        client, cannot be the vehicle of a forgery and is allowed through.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: csrf_origin_rejected
            message: El origen de la solicitud no está permitido.

    500InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    503ServiceUnavailable:
      description: System or downstream service dependency is unavailable or degraded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
