                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModuleResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

    post:
      tags:
        - Modules
      summary: Add module to course draft
      description: >
        Appends a new module at the end of the course. There is no position
        in the request body: issue #16's ordering policy always assigns the
        next position on insert (internal/domain/ordering.go); reordering
        existing modules is a separate operation.
      operationId: createCourseModule
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the course.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModuleRequest'
      responses:
        '201':
          description: Module created successfully.
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /modules/{module_id}:
    put:
      tags:
        - Modules
      summary: Rename a module
      operationId: updateModule
      security:
        - bearerAuth: []
      parameters:
        - name: module_id
