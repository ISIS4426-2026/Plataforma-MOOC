services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://moocuser:moocpassword@postgres:5432/moocdb?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-mooc-storage}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      - MEDIA_UPLOAD_URL_TTL=${MEDIA_UPLOAD_URL_TTL:-24h}
      - MEDIA_DOWNLOAD_URL_TTL=${MEDIA_DOWNLOAD_URL_TTL:-1h}
      - MEDIA_MAX_UPLOAD_MB=${MEDIA_MAX_UPLOAD_MB:-1024}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-25}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-5m}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_FROM=${SMTP_FROM:-no-reply@plataforma-mooc.local}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SESSION_TTL=${SESSION_TTL:-24h}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - EMAIL_VERIFICATION_TTL=${EMAIL_VERIFICATION_TTL:-24h}
      - PASSWORD_RESET_TTL=${PASSWORD_RESET_TTL:-1h}
      - CSRF_ALLOWED_ORIGINS=${CSRF_ALLOWED_ORIGINS:-}
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-24h}
      - RATE_LIMIT_LOGIN_ATTEMPTS=${RATE_LIMIT_LOGIN_ATTEMPTS:-10}
      - RATE_LIMIT_LOGIN_WINDOW=${RATE_LIMIT_LOGIN_WINDOW:-1m}
      - RATE_LIMIT_REGISTER_ATTEMPTS=${RATE_LIMIT_REGISTER_ATTEMPTS:-50}
      - RATE_LIMIT_REGISTER_WINDOW=${RATE_LIMIT_REGISTER_WINDOW:-1h}
      - RATE_LIMIT_RECOVERY_ATTEMPTS=${RATE_LIMIT_RECOVERY_ATTEMPTS:-50}
      - RATE_LIMIT_RECOVERY_WINDOW=${RATE_LIMIT_RECOVERY_WINDOW:-1h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgres://moocuser:moocpassword@postgres:5432/moocdb?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-mooc-storage}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-25}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-5m}
      - METRICS_PORT=9090
    ports:
      # Prometheus-style metrics (issue #21). The worker has no other HTTP
      # server, so this is its own port rather than sharing the API's.
      - "${WORKER_METRICS_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moocuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moocpassword}
      POSTGRES_DB: ${POSTGRES_DB:-moocdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Todas las migraciones, aplicadas en orden por el script de arranque.
      # Montar la carpeta completa evita que agregar una migracion nueva exija
      # tocar este archivo, que fue justo lo que dejo la base sin las tablas
      # de tokens.
      - ./migrations:/migrations:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01_init_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-moocuser} -d $${POSTGRES_DB:-moocdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  # MinIO's own public images were withdrawn: quay.io/minio/minio now answers
  # 401 for every tag and docker.io/minio/minio returns 404. This is the same
  # upstream server, packaged by Bitnami, pinned to an exact tag so a registry
  # change cannot break the stack again without us choosing it.
  #
  # The Bitnami image brings its own entrypoint (no `command:` needed), runs as
  # uid 1001, keeps data under /bitnami/minio/data, and creates the buckets in
  # MINIO_DEFAULT_BUCKETS at startup -- which is why the separate minio-init
  # service is gone.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-mooc-storage}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
  minio_data:
